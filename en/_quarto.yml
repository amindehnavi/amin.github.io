project:
  type: website
  resources:
    - assets/**

lang: en
date-format: "MMMM D, YYYY"

execute:
  freeze: auto

website:
  title: "Amin Dehnavi"
  site-url: "https://amindehnavi.github.io/amin.github.io/"
  repo-url: "https://github.com/amindehnavi/amin.github.io"
  draft-mode: gone
  favicon: assets/images/favicon.svg
  page-footer:
    left: "© 2026 Amin Dehnavi · Text licensed CC BY 4.0"
    right:
      - icon: github
        href: "https://github.com/amindehnavi"
        aria-label: "GitHub"
      - icon: rss
        href: blog.xml
        aria-label: "RSS feed"
  navbar:
    left:
      - href: index.qmd
        text: "Home"
      - href: blog.qmd
        text: "Blog"
      - href: projects.qmd
        text: "Projects"
      - href: publications.qmd
        text: "Publications"
      - href: cv.qmd
        text: "CV"
    right:
      - href: "https://amindehnavi.github.io/amin.github.io/fa/"
        text: "فارسی"
        icon: translate
        aria-label: "Read in Persian"

format:
  html:
    theme:
      light: [cosmo, assets/styles/base.scss]
      dark: [cosmo, assets/styles/base.scss, assets/styles/dark.scss]
    toc: true
    code-copy: true
    html-math-method: mathjax
    include-after-body: assets/js/lang-switch.html
